<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 库存管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; }
        .login-box { max-width: 400px; margin: 100px auto; }
        .card { border: none; border-radius: 4px; box-shadow: 0 1px 1px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">库存管理系统</h3>
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登 录</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('register') }}">没有账号？立即注册</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
