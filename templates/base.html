<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}库存管理后台{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式（类有赞风格） -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
        }

        /* 侧边栏样式 */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 220px;
            background-color: #2f4050;
            color: #a7b1c2;
            z-index: 1000;
            transition: all 0.3s;
        }

        .sidebar-header {
            height: 60px;
            line-height: 60px;
            text-align: center;
            background-color: #293846;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #293846;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            position: relative;
        }

        .sidebar-menu li a {
            display: block;
            padding: 14px 20px;
            color: #a7b1c2;
            text-decoration: none;
            transition: all 0.3s;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: #293846;
            color: #fff;
            border-left: 4px solid #1ab394;
        }

        .sidebar-menu li a i {
            margin-right: 10px;
            width: 16px;
            text-align: center;
        }

        /* 主内容区 */
        .main-content {
            margin-left: 220px;
            min-height: 100vh;
            transition: all 0.3s;
        }

        /* 顶部导航栏 */
        .top-navbar {
            height: 60px;
            background-color: #fff;
            border-bottom: 1px solid #e7eaec;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .top-navbar .navbar-left {
            display: flex;
            align-items: center;
        }

        .top-navbar .navbar-right {
            display: flex;
            align-items: center;
        }

        .top-navbar .user-info {
            display: flex;
            align-items: center;
            color: #676a6c;
        }

        .top-navbar .user-info i {
            margin-right: 8px;
        }

        /* 页面内容 */
        .page-content {
            padding: 20px;
        }

        /* 卡片样式 */
        .card {
            border: none;
            border-radius: 4px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #e7eaec;
            padding: 15px 20px;
            font-weight: 600;
            color: #676a6c;
        }

        .card-body {
            padding: 20px;
        }

        /* 按钮样式 */
        .btn-primary {
            background-color: #1ab394;
            border-color: #1ab394;
        }

        .btn-primary:hover {
            background-color: #18a689;
            border-color: #18a689;
        }

        .btn-success {
            background-color: #1c84c6;
            border-color: #1c84c6;
        }

        .btn-success:hover {
            background-color: #1a7bb9;
            border-color: #1a7bb9;
        }

        .btn-danger {
            background-color: #ed5565;
            border-color: #ed5565;
        }

        .btn-danger:hover {
            background-color: #ec4758;
            border-color: #ec4758;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            库存管理系统
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/" class="active">
                    <i class="fa fa-dashboard"></i> 工作台
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa fa-cubes"></i> 库存管理
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa fa-exchange"></i> 出入库记录
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa fa-cog"></i> 系统设置
                </a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部导航栏 -->
        <div class="top-navbar">
            <div class="navbar-left">
                <h5 class="mb-0">{% block page_title %}扫码出入库{% endblock %}</h5>
            </div>
            <div class="navbar-right">
                <div class="user-info">
                    <i class="fa fa-user-circle-o"></i>
                    <span>管理员</span>
                </div>
            </div>
        </div>

        <!-- 页面内容 -->
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
