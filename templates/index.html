{% block extra_js %}
<!-- 替换为国内可访问的CDN地址 -->
<script src="https://unpkg.com/@zxing/library@0.21.0/umd/index.min.js"></script>

<script>
    let currentMode = 'in';
    let currentWaybill = '';
    let scannedProducts = [];
    let codeReader = null;
    let waybillCodeReader = null;
    let currentScannedProduct = null;

    // 10秒扫码冷却机制（防重复识别）
    const barcodeCooldown = new Map();
    const COOLDOWN_TIME = 10000;

    // 扫码枪快速入库模式
    let quickInMode = false;

    // 页面加载完成后初始化
    $(document).ready(function() {
        toggleFields();

        // 模态框关闭时自动停止摄像头 + 清空冷却记录
        $('#scannerModal').on('hidden.bs.modal', function() {
            stopScanner();
            scannedProducts = [];
            updateScannedList();
            barcodeCooldown.clear();
            // ✅ 新增：恢复视频和提示的显示（下次入库可用）
            $('#scannerVideo').show();
            $('.text-center.mt-2.text-muted').show();
        });

        $('#waybillModal').on('hidden.bs.modal', function() {
            stopWaybillScanner();
        });

        // 扫码枪输入监听（主页面）
        $('#barcodeInput').on('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchProduct();
            }
        });

        // 扫码枪输入监听（模态框内）
        $(document).on('keypress', '#modalBarcodeInput', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitModalBarcode();
            }
        });

        // 扫码枪自动永久聚焦主输入框
        setInterval(() => {
            const barcodeInput = document.getElementById('barcodeInput');
            const activeElement = document.activeElement;
            if (!activeElement ||
                (activeElement.tagName !== 'INPUT' &&
                 activeElement.tagName !== 'SELECT' &&
                 activeElement.tagName !== 'TEXTAREA')) {
                barcodeInput.focus();
            }
        }, 100);

        // 点击空白处自动聚焦
        document.addEventListener('click', function(e) {
            if (!e.target.closest('button') &&
                !e.target.closest('input') &&
                !e.target.closest('select') &&
                !e.target.closest('a')) {
                document.getElementById('barcodeInput').focus();
            }
        });

        // 定期清理过期冷却记录
        setInterval(() => {
            const now = Date.now();
            for (const [barcode, timestamp] of barcodeCooldown.entries()) {
                if (now - timestamp > COOLDOWN_TIME) {
                    barcodeCooldown.delete(barcode);
                }
            }
        }, 60000);
    });

    // 切换扫码枪快速入库模式
    function toggleQuickMode() {
        quickInMode = !quickInMode;
        const btn = document.getElementById('modeToggleBtn');

        if (quickInMode) {
            btn.classList.remove('btn-outline-warning');
            btn.classList.add('btn-warning');
            btn.innerHTML = '<i class="fa fa-bolt"></i> 快速入库模式';
            $('#barcodeInput').val('').focus();
            alert('已进入快速入库模式：扫描条码直接弹出入库表单');
        } else {
            btn.classList.remove('btn-warning');
            btn.classList.add('btn-outline-warning');
            btn.innerHTML = '<i class="fa fa-bolt"></i> 普通模式';
            $('#barcodeInput').val('').focus();
        }
    }

    function searchProduct() {
        const barcode = $('#barcodeInput').val().trim();
        if (!barcode) return;

        $.get(`/api/product/${barcode}`, function(data) {
            if (data.success) {
                const product = data.data;

                // 快速入库模式：直接弹出快速入库表单
                if (quickInMode) {
                    currentScannedProduct = product;
                    $('#quickInProductId').val(product.id);
                    $('#quickInProductName').text(`产品：${product.name}${product.spec ? ' (' + product.spec + ')' : ''}`);
                    $('#quickInQuantity').val(1);
                    $('#quickInBatchNo').val('');
                    $('#quickInProductionDate').val('');
                    $('#quickInExpiryDate').val('');
                    $('#quickInPlatform').val('红书');
                    $('#quickInRemark').val('退货');
                    const quickInModal = new bootstrap.Modal(document.getElementById('quickInModal'));
                    quickInModal.show();

                    $('#barcodeInput').val('').focus();
                    return;
                }

                // 普通模式：显示产品信息
                $('#productId').val(product.id);
                $('#productName').text(`名称：${product.name}${product.spec ? ' (' + product.spec + ')' : ''}`);
                $('#productStock').text(`当前库存：${product.stock} ${product.unit}`);
                $('#productInfo').removeClass('d-none');
                $('#addProductForm').addClass('d-none');
                $('#barcodeInput').val('');
                $('#barcodeInput').focus();
                toggleFields();
            } else {
                $('#newBarcode').val(barcode);
                $('#addProductForm').removeClass('d-none');
                $('#productInfo').addClass('d-none');
                $('#newProductName').focus();
            }
        });
    }

    function toggleFields() {
        const type = $('#operationType').val();
        const remarkSelect = $('#remarkSelect');
        remarkSelect.empty();
        if (type === 'in') {
            remarkSelect.append('<option value="退货">退货</option>');
            remarkSelect.append('<option value="样品">样品</option>');
            remarkSelect.append('<option value="other">其他</option>');
            $('#platformField').show();
        } else {
            remarkSelect.append('<option value="样品">样品</option>');
            remarkSelect.append('<option value="奖品">奖品</option>');
            remarkSelect.append('<option value="满赠">满赠</option>');
            remarkSelect.append('<option value="换货">换货</option>');
            remarkSelect.append('<option value="内购">内购</option>');
            remarkSelect.append('<option value="other">其它</option>');
            $('#platformField').show();
        }
        $('#remarkManual').addClass('d-none').val('');
        $('#platformSelect').val('红书');
        $('#platformManual').addClass('d-none').val('');
    }

    function handleRemarkSelect() {
        const val = $('#remarkSelect').val();
        if (val === 'other') {
            $('#remarkManual').removeClass('d-none').focus();
        } else {
            $('#remarkManual').addClass('d-none').val('');
        }
    }

    function handlePlatformSelect() {
        const val = $('#platformSelect').val();
        if (val === 'other') {
            $('#platformManual').removeClass('d-none').focus();
        } else {
            $('#platformManual').addClass('d-none').val('');
        }
    }

    function handleBatchRemarkSelect() {
        const val = $('#outboundRemarkSelect').val();
        if (val === 'other') {
            $('#outboundRemarkManual').removeClass('d-none').focus();
        } else {
            $('#outboundRemarkManual').addClass('d-none').val('');
        }
    }

    function handleBatchPlatformSelect() {
        const val = $('#outboundPlatformSelect').val();
        if (val === 'other') {
            $('#outboundPlatformManual').removeClass('d-none').focus();
        } else {
            $('#outboundPlatformManual').addClass('d-none').val('');
        }
    }

    // 手动表单提交（含入库必填校验）
    $('#submitBtn').on('click', function() {
        const productId = $('#productId').val();
        const type = $('#operationType').val();
        const quantity = $('#quantity').val();
        const operator = $('#operator').val();
        const batchNo = $('#batch_no').val().trim();
        const productionDate = $('#production_date').val();
        const expiryDate = $('#expiry_date').val();
        const platformSelect = $('#platformSelect').val();
        const platformManual = $('#platformManual').val().trim();
        let platform = platformSelect === 'other' ? (platformManual || '其它') : platformSelect;
        const remarkSelect = $('#remarkSelect').val();
        const remarkManual = $('#remarkManual').val().trim();
        let remark = remarkSelect === 'other' ? (remarkManual || '其他') : remarkSelect;

        // 入库必填验证
        if (type === 'in') {
            if (!batchNo) { alert('请填写批次号'); return; }
            if (!productionDate) { alert('请选择生产日期'); return; }
            if (!expiryDate) { alert('请选择到期日期'); return; }
            if (platformSelect === 'other' && !platformManual) { alert('请填写平台'); return; }
            if (remarkSelect === 'other' && !remarkManual) { alert('请填写备注'); return; }
        }

        const url = type === 'in' ? '/api/stock/in' : '/api/stock/out';
        $.post(url, {
            product_id: productId,
            quantity: quantity,
            operator: operator,
            batch_no: batchNo,
            production_date: productionDate,
            expiry_date: expiryDate,
            platform: platform,
            remark: remark
        }, function(data) {
            if (data.success) {
                alert(data.message);
                location.reload();
            } else {
                alert(data.message);
            }
        });
    });

    // 添加新产品
    $('#addProductBtn').on('click', function() {
        const barcode = $('#newBarcode').val();
        const name = $('#newProductName').val().trim();
        const spec = $('#newProductSpec').val().trim();
        const unit = $('#newProductUnit').val().trim();

        if (!name) {
            alert('请输入产品名称');
            return;
        }

        $.post('/api/product/add', {
            barcode: barcode,
            name: name,
            spec: spec,
            unit: unit
        }, function(data) {
            if (data.success) {
                alert(data.message);
                $('#barcodeInput').val(barcode);
                searchProduct();
            } else {
                alert(data.message);
            }
        });
    });

    function openModeSelect() {
        const modeModal = new bootstrap.Modal(document.getElementById('modeSelectModal'));
        modeModal.show();
    }

    function startScan(mode) {
        currentMode = mode;
        $('#modeSelectModal').modal('hide');

        if (mode === 'out') {
            const waybillModal = new bootstrap.Modal(document.getElementById('waybillModal'));
            waybillModal.show();
            $('#waybillNumber').val('');
            $('#waybillNumber').focus();
            $('#waybillScanArea').addClass('d-none');
            stopWaybillScanner();
        } else {
            // 入库模式：询问使用扫码枪还是手机扫码
            if (confirm('是否使用扫码枪快速入库？\n\n✅ 确定：扫码枪直接在主页面快速入库\n❌ 取消：使用手机摄像头扫码')) {
                // 进入扫码枪快速入库模式
                quickInMode = true;
                $('#modeToggleBtn').removeClass('btn-outline-warning').addClass('btn-warning');
                $('#modeToggleBtn').html('<i class="fa fa-bolt"></i> 快速入库模式');
                alert('已进入扫码枪快速入库模式\n直接用扫码枪扫描条码即可弹出入库表单');
                $('#barcodeInput').val('').focus();
            } else {
                // 手机扫码模式
                $('#scanModeText').text('扫码入库');
                $('#waybillDisplay').text('');
                $('#outboundList').addClass('d-none');
                const scannerModal = new bootstrap.Modal(document.getElementById('scannerModal'));
                scannerModal.show();
            }
        }
    }

    function toggleWaybillScan() {
        const scanArea = $('#waybillScanArea');
        if (scanArea.hasClass('d-none')) {
            scanArea.removeClass('d-none');
            startWaybillScanner();
        } else {
            scanArea.addClass('d-none');
            stopWaybillScanner();
        }
    }

    function startWaybillScanner() {
        stopWaybillScanner();
        waybillCodeReader = new ZXing.BrowserMultiFormatReader();

        waybillCodeReader.decodeFromVideoDevice(null, 'waybillVideo', (result, err) => {
            if (result) {
                $('#waybillNumber').val(result.text);
                toggleWaybillScan();
                playBeep();
            }
            if (err && !(err instanceof ZXing.NotFoundException)) {
                console.error('运单扫码错误:', err);
                if (err.name === 'NotAllowedError') {
                    alert('摄像头权限被拒绝，请在浏览器设置中允许访问摄像头');
                    toggleWaybillScan();
                }
            }
        }).catch(err => {
            console.error('运单摄像头启动失败:', err);
            alert('无法启动摄像头：' + err.message);
            toggleWaybillScan();
        });
    }

    function stopWaybillScanner() {
        if (waybillCodeReader) {
            waybillCodeReader.reset();
            waybillCodeReader = null;
        }
    }

    function confirmWaybill() {
        currentWaybill = $('#waybillNumber').val().trim();
        if (!currentWaybill) {
            alert('请输入或扫描运单号');
            return;
        }
        stopWaybillScanner();
        $('#waybillModal').modal('hide');

        scannedProducts = [];
        $('#scanModeText').text('扫码出库');
        $('#waybillDisplay').text(`运单号：${currentWaybill}`);
        $('#outboundList').removeClass('d-none');
        updateScannedList();
        const scannerModal = new bootstrap.Modal(document.getElementById('scannerModal'));
        scannerModal.show();

        // 自动聚焦到模态框内的条码输入框，扫码枪直接可用
        setTimeout(() => {
            document.getElementById('modalBarcodeInput').focus();
        }, 500);
    }

    // 处理模态框内的条码输入（扫码枪+手动）
    function submitModalBarcode() {
        const barcode = $('#modalBarcodeInput').val().trim();
        if (!barcode) return;

        // 冷却机制：10秒内不重复识别同一条码
        const now = Date.now();
        if (barcodeCooldown.has(barcode) && now - barcodeCooldown.get(barcode) < COOLDOWN_TIME) {
            $('#modalBarcodeInput').val('').focus();
            return;
        }
        barcodeCooldown.set(barcode, now);

        // 复用原有的条码处理逻辑
        handleScannedBarcode(barcode);
        playBeep();

        // 清空输入框，准备下一次扫描
        $('#modalBarcodeInput').val('').focus();
    }

    function openScanner() {
        stopScanner();
        codeReader = new ZXing.BrowserMultiFormatReader();

        codeReader.decodeFromVideoDevice(null, 'scannerVideo', (result, err) => {
            if (result) {
                const barcode = result.text.trim();
                if (barcode) {
                    // 冷却机制：10秒内不重复识别同一条码
                    const now = Date.now();
                    if (barcodeCooldown.has(barcode) && now - barcodeCooldown.get(barcode) < COOLDOWN_TIME) {
                        return;
                    }
                    barcodeCooldown.set(barcode, now);

                    handleScannedBarcode(barcode);
                    playBeep();
                }
            }
            if (err && !(err instanceof ZXing.NotFoundException)) {
                console.error('产品扫码错误:', err);
                if (err.name === 'NotAllowedError') {
                    alert('摄像头权限被拒绝，请在浏览器设置中允许访问摄像头');
                    $('#scannerModal').modal('hide');
                }
            }
        }).catch(err => {
            console.error('产品摄像头启动失败:', err);
            alert('无法启动摄像头：' + err.message);
            $('#scannerModal').modal('hide');
        });
    }

    function stopScanner() {
        if (codeReader) {
            codeReader.reset();
            codeReader = null;
        }
    }

    function playBeep() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = 1000;
            gainNode.gain.value = 0.1;
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.1);
        } catch (e) {}
    }

    function handleScannedBarcode(barcode) {
        $.get(`/api/product/${barcode}`, function(data) {
            if (data.success) {
                const product = data.data;
                if (currentMode === 'in') {
                    currentScannedProduct = product;
                    $('#quickInProductId').val(product.id);
                    $('#quickInProductName').text(`产品：${product.name}${product.spec ? ' (' + product.spec + ')' : ''}`);
                    $('#quickInQuantity').val(1);
                    $('#quickInBatchNo').val('');
                    $('#quickInProductionDate').val('');
                    $('#quickInExpiryDate').val('');
                    $('#quickInPlatform').val('红书');
                    $('#quickInRemark').val('退货');
                    const quickInModal = new bootstrap.Modal(document.getElementById('quickInModal'));
                    quickInModal.show();
                } else {
                    loadBatchesAndAdd(product);
                }
            } else {
                if (confirm(`未找到条码 ${barcode} 对应的产品，是否添加新产品？`)) {
                    $('#scannerModal').modal('hide');
                    $('#newBarcode').val(barcode);
                    $('#addProductForm').removeClass('d-none');
                    $('#productInfo').addClass('d-none');
                    $('#newProductName').focus();
                }
            }
        });
    }

    function submitQuickIn() {
        const productId = $('#quickInProductId').val();
        const quantity = $('#quickInQuantity').val();
        const batchNo = $('#quickInBatchNo').val().trim();
        const productionDate = $('#quickInProductionDate').val();
        const expiryDate = $('#quickInExpiryDate').val();
        const platform = $('#quickInPlatform').val();
        const remark = $('#quickInRemark').val();
        const operator = $('#operator').val();

        if (!batchNo) { alert('请填写批次号'); return; }
        if (!productionDate) { alert('请选择生产日期'); return; }
        if (!expiryDate) { alert('请选择到期日期'); return; }

        $.post('/api/stock/in', {
            product_id: productId,
            quantity: quantity,
            operator: operator,
            batch_no: batchNo,
            production_date: productionDate,
            expiry_date: expiryDate,
            platform: platform,
            remark: remark
        }, function(res) {
            if (res.success) {
                alert(`${currentScannedProduct.name} 入库成功！当前库存：${res.current_stock}`);
                $('#quickInModal').modal('hide');
                currentScannedProduct = null;
                // 提交成功后自动聚焦输入框，准备下一次扫描
                if (quickInMode) {
                    $('#barcodeInput').focus();
                } else {
                    $('#modalBarcodeInput').focus();
                }
            } else {
                alert(res.message);
            }
        });
    }

    // 每次扫码生成独立条目，不合并、不累加
    function loadBatchesAndAdd(product) {
        $.get(`/api/product/${product.id}/batches`, function(res) {
            const batches = res.success ? res.batches : [];
            if (batches.length === 0) {
                alert(`产品 ${product.name} 暂无批次号，请先入库建立批次。`);
                return;
            }
            // 直接新增一条记录
            scannedProducts.push({
                id: product.id,
                barcode: product.barcode || '',
                name: product.name,
                spec: product.spec,
                unit: product.unit,
                quantity: 1,
                batches: batches,
                selectedBatch: batches[0]
            });
            updateScannedList();
        });
    }

    function updateScannedList() {
        const list = $('#scannedProducts').empty();
        if (scannedProducts.length === 0) {
            list.append('<li class="list-group-item text-muted">暂无已扫描产品</li>');
            return;
        }
        scannedProducts.forEach((p, i) => {
            let batchOptions = '';
            p.batches.forEach(b => {
                batchOptions += `<option value="${b}" ${b === p.selectedBatch ? 'selected' : ''}>${b}</option>`;
            });
            const item = $(`
                <li class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
                    <div class="d-flex align-items-center flex-wrap">
                        <strong>${p.name}</strong> ${p.spec ? '(' + p.spec + ')' : ''}
                        <span class="badge bg-primary ms-2">${p.quantity} ${p.unit}</span>
                    </div>
                    <div class="d-flex align-items-center mt-2 mt-md-0">
                        <label class="me-2 mb-0">批次号:</label>
                        <select class="form-select form-select-sm batch-select" style="width: auto;" data-index="${i}">
                            ${batchOptions}
                        </select>
                        <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeProduct(${i})"><i class="fa fa-trash"></i></button>
                    </div>
                </li>`);
            list.append(item);
        });
        $('.batch-select').off('change').on('change', function() {
            const idx = $(this).data('index');
            scannedProducts[idx].selectedBatch = $(this).val();
        });
    }

    function removeProduct(index) {
        scannedProducts.splice(index, 1);
        updateScannedList();
    }

    function confirmOutbound() {
        if (scannedProducts.length === 0) {
            alert('请先扫描产品');
            return;
        }
        for (let i = 0; i < scannedProducts.length; i++) {
            const item = scannedProducts[i];
            if (!item.selectedBatch) {
                alert(`第${i+1}条记录（${item.name}）未选择批次号，请选择后再确认出库。`);
                return;
            }
        }
        let productHtml = '<table class="table table-sm"><thead><tr><th>序号</th><th>产品名称</th><th>规格</th><th>数量</th><th>批次号</th></tr></thead><tbody>';
        scannedProducts.forEach((p, i) => {
            productHtml += `
                <tr>
                    <td>${i+1}</td>
                    <td>${p.name}</td>
                    <td>${p.spec || '-'}</td>
                    <td>${p.quantity} ${p.unit}</td>
                    <td>${p.selectedBatch}</td>
                </tr>
            `;
        });
        productHtml += '</tbody></table>';
        $('#confirmProductList').html(productHtml);
        $('#outboundPlatformSelect').val('红书');
        $('#outboundPlatformManual').addClass('d-none').val('');
        $('#outboundRemarkSelect').val('样品');
        $('#outboundRemarkManual').addClass('d-none').val('');
        const confirmModal = new bootstrap.Modal(document.getElementById('confirmOutboundModal'));
        confirmModal.show();
    }

    function submitOutboundWithRemark() {
        const platformSelect = $('#outboundPlatformSelect').val();
        const platformManual = $('#outboundPlatformManual').val().trim();
        let platform = platformSelect === 'other' ? (platformManual || '其它') : platformSelect;

        const remarkSelect = $('#outboundRemarkSelect').val();
        const remarkManual = $('#outboundRemarkManual').val().trim();
        let remark = remarkSelect === 'other' ? (remarkManual || '其它') : remarkSelect;

        const operator = $('#operator').val();

        const payload = {
            waybill_number: currentWaybill,
            operator: operator,
            remark: remark,
            platform: platform,
            items: scannedProducts.map(p => ({
                product_id: p.id,
                quantity: p.quantity,
                batch_no: p.selectedBatch
            }))
        };
        $.ajax({
            url: '/api/stock/out_batch',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function(res) {
                alert(res.message);
                scannedProducts = [];
                currentWaybill = '';
                $('#confirmOutboundModal').modal('hide');
                $('#scannerModal').modal('hide');
                location.reload();
            },
            error: function(xhr) {
                alert('出库失败：' + (xhr.responseJSON?.message || xhr.statusText));
            }
        });
    }

    // 删除批次库存
    function deleteBatch(barcode, batchNo, currentStock) {
        $.get(`/api/product/${barcode}`, function(data) {
            if (!data.success) {
            alert('产品不存在');
            return;
        }
        const productName = data.data.name;
        if (!confirm(`确定要永久删除产品「${productName}」的批次「${batchNo}」吗？\n\n⚠️ 此操作将同时删除该产品本身及其所有库存记录，不可恢复！`)) {
            return;
        }

        $.ajax({
            url: '/api/inventory/delete_batch',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                product_id: data.data.id,
                batch_no: batchNo
            }),
            success: function(res) {
                if (res.success) {
                    alert('删除成功！');
                    location.reload();
                } else {
                    alert('删除失败：' + res.message);
                }
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    alert('需要管理员权限');
                } else {
                    alert('请求失败');
                    }
                }
            });
        });
    }

    // ✅ 核心修改：扫码模态框显示时，仅入库模式启动摄像头
    $('#scannerModal').on('shown.bs.modal', function() {
        // 只有入库模式才启动摄像头，出库模式不启动
        if (currentMode === 'in') {
            setTimeout(openScanner, 300);
        } else {
            // 出库模式：隐藏视频和提示文字，只保留输入框和列表
            $('#scannerVideo').hide();
            $('.text-center.mt-2.text-muted').hide();
        }
        // 自动聚焦到条码输入框，扫码枪直接可用
        document.getElementById('modalBarcodeInput').focus();
    });
</script>
{% endblock %}
