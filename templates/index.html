{% block extra_js %}
<!-- 备用CDN地址（解决原地址无法访问问题） -->
<script src="https://unpkg.com/@zxing/library@0.21.0/umd/index.min.js"></script>

<script>
    let currentMode = 'in';
    let currentWaybill = '';
    let scannedProducts = []; // 现在每个元素代表一次扫码（独立条目）
    let codeReader = null;
    let waybillCodeReader = null;
    let currentScannedProduct = null;

    // 条码识别冷却机制（10秒内不重复识别同一条码）
    const barcodeCooldown = new Map();
    const COOLDOWN_TIME = 10000;

    $(document).ready(function() {
        toggleFields();

        $('#scannerModal').on('hidden.bs.modal', function() {
            stopScanner();
            scannedProducts = [];
            updateScannedList();
            barcodeCooldown.clear();
        });

        $('#waybillModal').on('hidden.bs.modal', function() {
            stopWaybillScanner();
        });

        $('#barcodeInput').on('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchProduct();
            }
        });

        setInterval(() => {
            const now = Date.now();
            for (const [barcode, timestamp] of barcodeCooldown.entries()) {
                if (now - timestamp > COOLDOWN_TIME) {
                    barcodeCooldown.delete(barcode);
                }
            }
        }, 60000);
    });

    // ========== 以下是未修改的函数（保持原样） ==========
    function searchProduct() { /* 原代码不变 */ }
    function toggleFields() { /* 原代码不变 */ }
    function handleRemarkSelect() { /* 原代码不变 */ }
    function handlePlatformSelect() { /* 原代码不变 */ }
    function handleBatchRemarkSelect() { /* 原代码不变 */ }
    function handleBatchPlatformSelect() { /* 原代码不变 */ }
    $('#submitBtn').on('click', function() { /* 原代码不变 */ });
    $('#addProductBtn').on('click', function() { /* 原代码不变 */ });
    function openModeSelect() { /* 原代码不变 */ }
    function startScan(mode) { /* 原代码不变 */ }
    function toggleWaybillScan() { /* 原代码不变 */ }
    function startWaybillScanner() { /* 原代码不变 */ }
    function stopWaybillScanner() { /* 原代码不变 */ }
    function confirmWaybill() { /* 原代码不变 */ }
    function openScanner() { /* 原代码不变 */ }
    function stopScanner() { /* 原代码不变 */ }
    function playBeep() { /* 原代码不变 */ }
    function handleScannedBarcode(barcode) { /* 原代码不变 */ }
    function submitQuickIn() { /* 原代码不变 */ }
    // ========== 以上是未修改的函数 ==========

    // ✅ 修改1：每次扫码都添加独立条目，不再累加数量
    function loadBatchesAndAdd(product) {
        $.get(`/api/product/${product.id}/batches`, function(res) {
            const batches = res.success ? res.batches : [];
            if (batches.length === 0) {
                alert(`产品 ${product.name} 暂无批次号，请先入库建立批次。`);
                return;
            }

            // 直接添加新条目，不检查是否已存在
            scannedProducts.push({
                id: product.id,
                barcode: product.barcode || '',
                name: product.name,
                spec: product.spec,
                unit: product.unit,
                quantity: 1, // 每次扫码固定为1个
                batches: batches,
                selectedBatch: batches[0] // 默认选中第一个批次
            });

            updateScannedList();
        });
    }

    // ✅ 修改2：更新列表显示所有独立条目
    function updateScannedList() {
        const list = $('#scannedProducts').empty();
        if (scannedProducts.length === 0) {
            list.append('<li class="list-group-item text-muted">暂无已扫描产品</li>');
            return;
        }

        // 遍历所有独立条目（即使产品相同也分开显示）
        scannedProducts.forEach((item, index) => {
            let batchOptions = '';
            item.batches.forEach(batch => {
                batchOptions += `<option value="${batch}" ${batch === item.selectedBatch ? 'selected' : ''}>${batch}</option>`;
            });

            const listItem = $(`
                <li class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
                    <div class="d-flex align-items-center flex-wrap">
                        <strong>${item.name}</strong> ${item.spec ? '(' + item.spec + ')' : ''}
                        <span class="badge bg-primary ms-2">${item.quantity} ${item.unit}</span>
                    </div>
                    <div class="d-flex align-items-center mt-2 mt-md-0">
                        <label class="me-2 mb-0">批次号:</label>
                        <select class="form-select form-select-sm batch-select" style="width: auto;" data-index="${index}">
                            ${batchOptions}
                        </select>
                        <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeProduct(${index})">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                </li>
            `);
            list.append(listItem);
        });

        // 绑定批次号选择事件
        $('.batch-select').off('change').on('change', function() {
            const index = $(this).data('index');
            scannedProducts[index].selectedBatch = $(this).val();
        });
    }

    // ✅ 修改3：删除指定索引的独立条目
    function removeProduct(index) {
        scannedProducts.splice(index, 1);
        updateScannedList();
    }

    // ✅ 修改4：确认出库时显示所有独立条目
    function confirmOutbound() {
        if (scannedProducts.length === 0) {
            alert('请先扫描产品');
            return;
        }

        // 检查所有条目是否都选择了批次号
        for (let i = 0; i < scannedProducts.length; i++) {
            const item = scannedProducts[i];
            if (!item.selectedBatch) {
                alert(`第${i+1}条记录（${item.name}）未选择批次号，请选择后再确认出库。`);
                return;
            }
        }

        // 生成产品清单表格（显示所有独立条目）
        let productHtml = '<table class="table table-sm"><thead><tr><th>序号</th><th>产品名称</th><th>规格</th><th>数量</th><th>批次号</th></tr></thead><tbody>';
        scannedProducts.forEach((item, index) => {
            productHtml += `
                <tr>
                    <td>${index+1}</td>
                    <td>${item.name}</td>
                    <td>${item.spec || '-'}</td>
                    <td>${item.quantity} ${item.unit}</td>
                    <td>${item.selectedBatch}</td>
                </tr>
            `;
        });
        productHtml += '</tbody></table>';

        $('#confirmProductList').html(productHtml);
        $('#outboundPlatformSelect').val('红书');
        $('#outboundPlatformManual').addClass('d-none').val('');
        $('#outboundRemarkSelect').val('样品');
        $('#outboundRemarkManual').addClass('d-none').val('');

        const confirmModal = new bootstrap.Modal(document.getElementById('confirmOutboundModal'));
        confirmModal.show();
    }

    // ✅ 修改5：提交出库时发送所有独立条目
    function submitOutboundWithRemark() {
        const platformSelect = $('#outboundPlatformSelect').val();
        const platformManual = $('#outboundPlatformManual').val().trim();
        let platform = platformSelect === 'other' ? (platformManual || '其它') : platformSelect;

        const remarkSelect = $('#outboundRemarkSelect').val();
        const remarkManual = $('#outboundRemarkManual').val().trim();
        let remark = remarkSelect === 'other' ? (remarkManual || '其它') : remarkSelect;

        const operator = $('#operator').val();

        // 直接映射所有独立条目到请求体
        const payload = {
            waybill_number: currentWaybill,
            operator: operator,
            remark: remark,
            platform: platform,
            items: scannedProducts.map(item => ({
                product_id: item.id,
                quantity: item.quantity,
                batch_no: item.selectedBatch
            }))
        };

        $.ajax({
            url: '/api/stock/out_batch',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function(res) {
                alert(res.message);
                scannedProducts = [];
                currentWaybill = '';
                $('#confirmOutboundModal').modal('hide');
                $('#scannerModal').modal('hide');
                location.reload();
            },
            error: function(xhr) {
                alert('出库失败：' + (xhr.responseJSON?.message || xhr.statusText));
            }
        });
    }

    // 删除批次函数（保持原样）
    function deleteBatch(barcode, batchNo, currentStock) { /* 原代码不变 */ }

    // 扫码模态框显示时自动启动摄像头（保持原样）
    $('#scannerModal').on('shown.bs.modal', function() {
        setTimeout(openScanner, 300);
    });
</script>
{% endblock %}
