{% extends "base.html" %}

{% block title %}扫码出入库 - 库存管理系统{% endblock %}
{% block page_title %}扫码出入库{% endblock %}

{% block content %}
<!-- 扫码操作卡片 -->
<div class="card">
    <div class="card-header">
        <i class="fa fa-barcode"></i> 条码扫描
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-8">
                <div class="input-group input-group-lg mb-3">
                    <input type="text" id="barcodeInput" class="form-control"
                           placeholder="请用扫码枪扫描条码或点击手机扫码" autofocus>
                    <button class="btn btn-primary" onclick="searchProduct()">查询</button>
                    <button class="btn btn-success" onclick="openModeSelect()">
                        <i class="fa fa-mobile"></i> 手机扫码
                    </button>
                </div>
            </div>
        </div>

        <!-- 产品信息显示区（略） -->
        ...
    </div>
</div>

<!-- 库存列表卡片（略） -->
...

<!-- 模式选择模态框（同前） -->
...

<!-- 运单号输入模态框（同前，已支持扫码） -->
...

<!-- 手机扫码模态框 -->
<div class="modal fade" id="scannerModal" tabindex="-1" aria-labelledby="scannerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scannerModalLabel">
                    <span id="scanModeText">扫码入库</span>
                    <span id="waybillDisplay" class="ms-2 text-muted"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <video id="scannerVideo" width="100%" autoplay playsinline></video>
                <div class="text-center mt-2 text-muted">请将条码对准摄像头</div>

                <!-- 出库模式下显示已扫描产品列表 -->
                <div id="outboundList" class="d-none mt-3">
                    <h6>已扫描产品：</h6>
                    <ul id="scannedProducts" class="list-group"></ul>
                    <div class="d-grid mt-3">
                        <button type="button" class="btn btn-success" onclick="confirmOutbound()">确认出库</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 产品确认拍照模态框（仅第一个产品弹出） -->
<div class="modal fade" id="productConfirmModal" tabindex="-1" aria-labelledby="productConfirmLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productConfirmLabel">确认产品并拍照（母记录）</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="confirmProductInfo">
                    <h6 id="confirmProductName">产品名称</h6>
                    <p id="confirmProductSpec" class="text-muted"></p>
                </div>
                <hr>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" onclick="startTakePhoto()">
                        <i class="fa fa-camera"></i> 点击拍照
                    </button>
                </div>
                <div id="confirmCameraArea" class="mt-2 d-none">
                    <video id="confirmPhotoVideo" width="100%" autoplay playsinline></video>
                    <div class="d-grid mt-2">
                        <button class="btn btn-success" onclick="captureConfirmPhoto()">拍摄</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
<script>
    let currentMode = 'in';
    let currentWaybill = '';
    let scannedProducts = [];
    let codeReader;
    let pendingProduct = null;
    let confirmPhotoStream = null;

    // ... 其他已存在的函数（searchProduct, submitBtn, addProductBtn 等）保持不变 ...

    function handleScannedBarcode(barcode) {
        $.get(`/api/product/${barcode}`, function(data) {
            if (data.success) {
                const product = data.data;
                if (currentMode === 'in') {
                    // 入库直接加
                    $.post('/api/stock/in', {
                        product_id: product.id,
                        quantity: 1,
                        operator: '手机扫码'
                    }, res => {
                        alert(res.success ? `${product.name} 入库成功！当前库存：${res.current_stock}` : res.message);
                    });
                } else {
                    // 出库：如果是第一个产品，弹出拍照确认；否则直接添加
                    if (scannedProducts.length === 0) {
                        pendingProduct = product;
                        // 显示拍照确认框
                        $('#confirmProductName').text(`${product.name}${product.spec ? ' (' + product.spec + ')' : ''}`);
                        $('#confirmProductSpec').text(`规格：${product.spec || '无'} | 单位：${product.unit}`);
                        $('#confirmCameraArea').addClass('d-none');
                        stopConfirmPhotoStream();
                        $('#scannerModal').modal('hide');
                        const productConfirmModal = new bootstrap.Modal(document.getElementById('productConfirmModal'));
                        productConfirmModal.show();
                        $('#productConfirmModal').on('hidden.bs.modal', function() {
                            stopConfirmPhotoStream();
                            openScanner(); // 重新打开扫描界面
                            $(this).off('hidden.bs.modal');
                        });
                    } else {
                        // 后续产品直接加入列表（无照片）
                        scannedProducts.push({
                            id: product.id,
                            barcode: product.barcode || '',
                            name: product.name,
                            spec: product.spec,
                            unit: product.unit,
                            quantity: 1,
                            photo: '' // 子记录无照片
                        });
                        updateScannedList();
                    }
                }
            } else {
                if (confirm(`未找到条码 ${barcode} 对应的产品，是否添加新产品？`)) {
                    $('#scannerModal').modal('hide');
                    $('#newBarcode').val(barcode);
                    $('#addProductForm').removeClass('d-none');
                    $('#productInfo').addClass('d-none');
                    $('#newProductName').focus();
                }
            }
        });
    }

    function startTakePhoto() {
        $('#confirmCameraArea').removeClass('d-none');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                confirmPhotoStream = stream;
                document.getElementById('confirmPhotoVideo').srcObject = stream;
            })
            .catch(err => {
                console.error(err);
                alert('无法访问后置摄像头');
                $('#confirmCameraArea').addClass('d-none');
            });
    }

    function captureConfirmPhoto() {
        if (!pendingProduct) return;
        const video = document.getElementById('confirmPhotoVideo');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const photoData = canvas.toDataURL('image/jpeg', 0.8);

        scannedProducts.push({
            id: pendingProduct.id,
            barcode: pendingProduct.barcode || '',
            name: pendingProduct.name,
            spec: pendingProduct.spec,
            unit: pendingProduct.unit,
            quantity: 1,
            photo: photoData // 仅母记录有照片
        });

        stopConfirmPhotoStream();
        $('#confirmCameraArea').addClass('d-none');
        bootstrap.Modal.getInstance(document.getElementById('productConfirmModal')).hide();
        updateScannedList();
    }

    function updateScannedList() {
        const list = $('#scannedProducts').empty();
        if (scannedProducts.length === 0) {
            list.append('<li class="list-group-item text-muted">暂无已扫描产品</li>');
            return;
        }
        scannedProducts.forEach((p, i) => {
            const item = $(`
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${p.name}</strong> ${p.spec ? '('+p.spec+')' : ''}
                        <span class="badge bg-primary ms-2">${p.quantity} ${p.unit}</span>
                        ${i === 0 ? '<span class="badge bg-success ms-1">主记录(已拍照)</span>' : ''}
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeProduct(${i})"><i class="fa fa-trash"></i></button>
                </li>`);
            list.append(item);
        });
    }

    function removeProduct(index) {
        scannedProducts.splice(index, 1);
        // 如果删除了第一个，新的第一个没有照片，下次提交时需注意
        updateScannedList();
    }

    function confirmOutbound() {
        if (scannedProducts.length === 0) return alert('请先扫描产品');
        if (!scannedProducts[0].photo) {
            return alert('母记录必须拍照，请重新添加第一个产品并拍照');
        }
        const payload = {
            waybill_number: currentWaybill,
            operator: '手机扫码',
            remark: '',
            items: scannedProducts.map((p, i) => ({
                product_id: p.id,
                quantity: p.quantity,
                photo_data: i === 0 ? p.photo : '' // 仅第一个传照片
            }))
        };
        $.ajax({
            url: '/api/stock/out_batch',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: res => {
                alert(res.message);
                scannedProducts = [];
                currentWaybill = '';
                $('#scannerModal').modal('hide');
                location.reload();
            },
            error: xhr => {
                alert('出库失败：' + (xhr.responseJSON?.message || xhr.statusText));
            }
        });
    }
    // ... 其余函数保持不变 ...
</script>
{% endblock %}
