{% extends "base.html" %}
{% block title %}库存管理 - 库存管理系统{% endblock %}
{% block page_title %}库存管理{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <i class="fa fa-cubes"></i> 库存调整
    </div>
    <div class="card-body">
        <form id="adjustForm" class="row g-3">
            <div class="col-md-3">
                <input type="text" id="adjustBarcode" class="form-control" placeholder="产品条码" required>
            </div>
            <div class="col-md-2">
                <select id="adjustType" class="form-select">
                    <option value="in">增加库存</option>
                    <option value="out">减少库存</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="number" id="adjustQuantity" class="form-control" placeholder="数量" min="1" required>
            </div>
            <div class="col-md-2">
                <input type="text" id="adjustBatch" class="form-control" placeholder="批次号">
            </div>
            <div class="col-md-3">
                <input type="text" id="adjustOperator" class="form-control" placeholder="操作人" value="管理员">
            </div>
            <div class="col-md-4">
                <input type="date" id="adjustProductionDate" class="form-control" placeholder="生产日期">
            </div>
            <div class="col-md-4">
                <input type="date" id="adjustExpiryDate" class="form-control" placeholder="到期日期">
            </div>
            <div class="col-md-4">
                <input type="text" id="adjustRemark" class="form-control" placeholder="备注">
            </div>
            <div class="col-12">
                <button type="button" id="adjustSubmit" class="btn btn-primary">确认调整</button>
            </div>
        </form>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header">
        <i class="fa fa-list"></i> 当前库存（按批次）
    </div>
    <div class="card-body" id="inventoryList">
        <div class="text-center text-muted">调整后请刷新页面查看最新库存</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $('#adjustSubmit').on('click', function() {
        const barcode = $('#adjustBarcode').val().trim();
        if (!barcode) {
            alert('请输入产品条码');
            return;
        }
        $.get(`/api/product/${barcode}`, function(data) {
            if (!data.success) {
                alert('未找到该条码对应的产品，请先在首页添加');
                return;
            }
            const productId = data.data.id;
            const adjustType = $('#adjustType').val();
            const quantity = $('#adjustQuantity').val();
            const batch = $('#adjustBatch').val();
            const operator = $('#adjustOperator').val() || '管理员';
            const productionDate = $('#adjustProductionDate').val();
            const expiryDate = $('#adjustExpiryDate').val();
            const remark = $('#adjustRemark').val();

            if (!quantity || quantity <= 0) {
                alert('请输入有效数量');
                return;
            }

            $.post('/api/inventory/adjust', {
                product_id: productId,
                adjust_type: adjustType,
                quantity: quantity,
                operator: operator,
                batch_no: batch,
                production_date: productionDate,
                expiry_date: expiryDate,
                remark: remark
            }, function(res) {
                if (res.success) {
                    alert(res.message);
                    $('#adjustBarcode').val('');
                    $('#adjustQuantity').val('');
                    $('#adjustBatch').val('');
                    $('#adjustProductionDate').val('');
                    $('#adjustExpiryDate').val('');
                    $('#adjustRemark').val('');
                } else {
                    alert(res.message);
                }
            });
        });
    });
</script>
{% endblock %}
