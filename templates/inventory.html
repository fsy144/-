{% extends "base.html" %}
{% block title %}库存管理 - 库存管理系统{% endblock %}
{% block page_title %}库存管理{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <i class="fa fa-cubes"></i> 库存调整
    </div>
    <div class="card-body">
        <form id="adjustForm" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">产品条码/批次号</label>
                <input type="text" id="adjustBarcode" class="form-control" placeholder="输入条码或批次号" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">操作类型</label>
                <select id="adjustType" class="form-select">
                    <option value="in">增加库存</option>
                    <option value="out">减少库存</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">数量 *</label>
                <input type="number" id="adjustQuantity" class="form-control" placeholder="数量" min="1" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">批次号 *</label>
                <input type="text" id="adjustBatch" class="form-control" placeholder="必填" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">操作人</label>
                <input type="text" id="adjustOperator" class="form-control" value="{{ session['username'] }}" readonly>
            </div>
            <div class="col-md-4">
                <label class="form-label">生产日期</label>
                <input type="date" id="adjustProductionDate" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">到期日期</label>
                <input type="date" id="adjustExpiryDate" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">备注</label>
                <input type="text" id="adjustRemark" class="form-control" placeholder="备注">
            </div>
            <div class="col-12">
                <button type="button" id="adjustSubmit" class="btn" style="background-color: #1ab394; border: none; color: white;">确认调整</button>
            </div>
        </form>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fa fa-list"></i> 当前库存（按批次）</span>
        <div class="input-group input-group-sm" style="width: 300px;">
            <input type="text" id="inventoryFilter" class="form-control" placeholder="输入产品名称/条码/批次号筛选">
            <button class="btn btn-primary" onclick="filterInventory()">筛选</button>
            <button class="btn btn-outline-secondary" onclick="resetFilter()">重置</button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive" id="inventoryTableContainer">
            <div class="text-center text-muted">加载中...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var can_adjust = {{ 'true' if can_adjust else 'false' }};
    let originalInventoryData = [];

    $(document).ready(function() {
        loadAllInventory();

        $('#inventoryFilter').on('keypress', function(e) {
            if (e.key === 'Enter') {
                filterInventory();
            }
        });
    });

    function loadAllInventory() {
        $.get('/api/inventory/search', { keyword: '' }, function(res) {
            if (res.success) {
                originalInventoryData = res.data;
            }
            renderInventoryTable(res);
        }).fail(function() {
            $('#inventoryTableContainer').html('<div class="alert alert-danger">加载库存失败，请稍后重试</div>');
        });
    }

    function searchByAdjustInput() {
        const keyword = $('#adjustBarcode').val().trim();
        if (!keyword) {
            alert('请输入产品条码或批次号');
            return;
        }
        $.get('/api/inventory/search', { keyword: keyword }, function(res) {
            if (res.success) {
                originalInventoryData = res.data;
            }
            renderInventoryTable(res);
        }).fail(function() {
            $('#inventoryTableContainer').html('<div class="alert alert-danger">查询失败</div>');
        });
    }

    function filterInventory() {
        const keyword = $('#inventoryFilter').val().trim().toLowerCase();
        let filteredData = originalInventoryData;

        if (keyword) {
            filteredData = originalInventoryData.filter(item => {
                return item.product_name.toLowerCase().includes(keyword) ||
                       item.barcode.toLowerCase().includes(keyword) ||
                       item.batch_no.toLowerCase().includes(keyword);
            });
        }

        renderInventoryTable({ success: true, data: filteredData });
    }

    function resetFilter() {
        $('#inventoryFilter').val('');
        renderInventoryTable({ success: true, data: originalInventoryData });
    }

    function renderInventoryTable(res) {
        if (res.success) {
            if (res.data.length === 0) {
                $('#inventoryTableContainer').html('<div class="alert alert-info">暂无库存数据</div>');
                return;
            }

            let totalStock = 0;
            res.data.forEach(item => {
                totalStock += parseInt(item.stock) || 0;
            });

            let html = '<table class="table table-bordered table-sm"><thead><tr><th>产品名称</th><th>条码</th><th>批次号</th><th>库存数量</th><th>单位</th></tr></thead><tbody>';
            res.data.forEach(item => {
                html += `<tr><td>${item.product_name}</td><td>${item.barcode}</td><td>${item.batch_no}</td><td>${item.stock}</td><td>${item.unit}</td></tr>`;
            });

            html += `<tr class="table-primary fw-bold">
                        <td colspan="3" class="text-end">合计：</td>
                        <td>${totalStock}</td>
                        <td>-</td>
                    </tr>`;
            html += '</tbody></table>';
            $('#inventoryTableContainer').html(html);
        } else {
            $('#inventoryTableContainer').html(`<div class="alert alert-warning">${res.message}</div>`);
        }
    }

    $('#adjustSubmit').on('click', function() {
        if (!can_adjust) {
            alert('您没有库存调整权限，请联系管理员');
            return;
        }
        const barcode = $('#adjustBarcode').val().trim();
        const batch = $('#adjustBatch').val().trim();
        if (!barcode) { alert('请输入产品条码'); return; }
        if (!batch) { alert('批次号不能为空'); return; }
        $.get(`/api/product/${barcode}`, function(data) {
            if (!data.success) { alert('未找到该条码对应的产品'); return; }
            const productId = data.data.id;
            const adjustType = $('#adjustType').val();
            const quantity = $('#adjustQuantity').val();
            // 操作人从只读字段获取，无需再传
            const productionDate = $('#adjustProductionDate').val();
            const expiryDate = $('#adjustExpiryDate').val();
            const remark = $('#adjustRemark').val();
            if (!quantity || quantity <= 0) { alert('请输入有效数量'); return; }
            $.post('/api/inventory/adjust', {
                product_id: productId,
                adjust_type: adjustType,
                quantity: quantity,
                batch_no: batch,
                production_date: productionDate,
                expiry_date: expiryDate,
                remark: remark
            }, function(res) {
                if (res.success) {
                    alert(res.message);
                    $('#adjustQuantity').val('');
                    $('#adjustBatch').val('');
                    $('#adjustProductionDate').val('');
                    $('#adjustExpiryDate').val('');
                    $('#adjustRemark').val('');
                    loadAllInventory();
                } else {
                    alert(res.message);
                }
            });
        });
    });
</script>
{% endblock %}
